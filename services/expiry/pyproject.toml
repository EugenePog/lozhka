[project]
name = "lozhka-expiry"
version = "0.1.0"
description = "M5 expiry scan and digests"
requires-python = ">=3.12"
dependencies = [
  "lozhka-common",
  "lozhka-notify",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lozhka_expiry"]
