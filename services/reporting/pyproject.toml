[project]
name = "lozhka-reporting"
version = "0.1.0"
description = "M6 scheduled report exports"
requires-python = ">=3.12"
dependencies = [
  "lozhka-common",
  "lozhka-notify",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lozhka_reporting"]
