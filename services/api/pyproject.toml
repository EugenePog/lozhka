[project]
name = "lozhka-api"
version = "0.1.0"
description = "Public API (Django + Django Ninja). Owns the app schema models"
requires-python = ">=3.12"
dependencies = [
  "lozhka-common",
  "lozhka-notify",
  "django>=5.2,<6",
  "django-ninja>=1.4",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23",
  "cryptography>=43",
  "gunicorn>=22",
  "uvicorn>=0.30",
  "whitenoise>=6.7",
  "tzdata",
]

[dependency-groups]
dev = ["pytest-django>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lozhka_api"]
