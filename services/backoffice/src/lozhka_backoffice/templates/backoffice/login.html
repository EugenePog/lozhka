{% extends "backoffice/base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<div class="login"><div class="card"><h1>Staff log in</h1><p class="sub">Accounts are created by an administrator.</p>
{% if error %}<div class="msg error">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
<label for="u">Email</label><input id="u" name="username" type="email" autocomplete="username" required autofocus style="width:100%">
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required style="width:100%">
<p><button class="btn" type="submit" style="width:100%">Log in</button></p></form></div></div>{% endblock %}
