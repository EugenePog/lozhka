{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Staff{% endblock %} · Lozhka office</title>
<link rel="stylesheet" href="{% static 'backoffice/app.css' %}">
<script src="{% static 'backoffice/htmx.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
<header class="top"><span class="brand">Lozhka · office</span>
<nav>{% for item in menu %}<a href="{% url item.url %}" class="{% if item.url == active %}on{% endif %}">{{ item.label }}</a>{% endfor %}</nav>
{% if user.is_authenticated %}<span class="who">{{ user.get_username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>{% endif %}</header>
<main>{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body></html>
