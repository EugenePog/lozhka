[project]
name = "lozhka-backoffice"
version = "0.1.0"
description = "Staff console: role-based Django templates + HTMX screens. Part of the API Django project"
requires-python = ">=3.12"
dependencies = [
  "lozhka-common",
  "lozhka-notify",
  # Documented exception to "services import only from libs/": the staff console is a Django app
  # inside the API project and uses its models (docs 03 section 2).
  "lozhka-api",
  "django-axes>=7",
]

[tool.uv.sources]
lozhka-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lozhka_backoffice"]
