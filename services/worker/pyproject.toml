[project]
name = "lozhka-worker"
version = "0.1.0"
description = "Job-queue application and task registry"
requires-python = ">=3.12"
dependencies = [
  "lozhka-common",
  "procrastinate>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lozhka_worker"]
