[project]
name = "lozhka-common"
version = "0.1.0"
description = "Shared settings, database access and logging helpers"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lozhka_common"]
