[project]
name = "lozhka-notify"
version = "0.1.0"
description = "Notification channels (email, Telegram) shared by all modules"
requires-python = ">=3.12"
dependencies = [
  "lozhka-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lozhka_notify"]
